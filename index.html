<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>樂器入門 · 七種管樂與弦樂的 YouTube 教學精選</title>
<meta name="description" content="長笛、單簧管、薩克斯風、法國號，以及小提琴、中提琴、大提琴的 YouTube 入門教學精選：可依樂器、語言、類型篩選，勾選看過的影片追蹤進度，進度只存在你的手機。">
<meta name="theme-color" content="#eceff2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎷%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eceff2; --paper-2:#dfe4e9; --ink:#121a24; --mute:#556171; --rule:#c3cbd4; --staff:#9aa5b1;
  --flute:#2f6485; --clarinet:#1c1c24; --horn:#8c5a0a;
  --violin:#8f2f2a; --viola:#6e3a78; --cello:#55601a; --sax:#0f6b5a;
  --serif:"LXGW WenKai TC","Kaiti TC","BiauKai",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.75 var(--sans)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}

/* ── 開場 ── */
.hero{padding:56px 0 0}
h1{margin:0;font:700 clamp(2.1rem,8.6vw,4rem)/1.18 var(--serif);letter-spacing:.01em}
h1 .ph{display:inline-block}
.lede{margin:18px 0 0;max-width:34em;color:var(--mute);font-size:1.02rem;text-wrap:pretty}

/* ── 五線譜選擇器：七種樂器是譜上的七顆音符，高低對應最低音的高低 ── */
.staff{position:relative;display:grid;grid-template-columns:repeat(8,1fr);margin-top:40px}
.staff::before,.staff::after{content:"";position:absolute;top:30px;height:49px;background:var(--ink)}
.staff::before{left:0;width:2px}
.staff::after{right:0;width:7px;background:linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px)}
.pick{position:relative;border:0;background:none;padding:112px 4px 8px;text-align:center;cursor:pointer;--c:var(--ink)}
.pick[data-k=flute]{--c:var(--flute)} .pick[data-k=clarinet]{--c:var(--clarinet)} .pick[data-k=horn]{--c:var(--horn)}
.pick[data-k=violin]{--c:var(--violin)} .pick[data-k=viola]{--c:var(--viola)} .pick[data-k=cello]{--c:var(--cello)} .pick[data-k=sax]{--c:var(--sax)}
.lines{position:absolute;left:0;right:0;top:0;height:108px;
  background:
   linear-gradient(var(--staff),var(--staff)) 0 30px/100% 1px no-repeat,
   linear-gradient(var(--staff),var(--staff)) 0 42px/100% 1px no-repeat,
   linear-gradient(var(--staff),var(--staff)) 0 54px/100% 1px no-repeat,
   linear-gradient(var(--staff),var(--staff)) 0 66px/100% 1px no-repeat,
   linear-gradient(var(--staff),var(--staff)) 0 78px/100% 1px no-repeat}
.head{position:absolute;left:50%;width:26px;height:18px;margin:-9px 0 0 -13px;color:var(--mute)}
.head i{position:absolute;inset:0;border:2.5px solid currentColor;border-radius:50%;transform:rotate(-20deg);background:var(--paper);transition:background .15s,color .15s}
.head::after{content:"";position:absolute;width:2px;height:0;background:currentColor;transition:height .18s}
.head.up::after{right:0;bottom:50%}
.head.down::after{left:0;top:50%}
.pick[aria-pressed=true] .head{color:var(--c)}
.pick[aria-pressed=true] .head i{background:var(--c)}
.pick[aria-pressed=true] .head::after{height:50px}
.rest{position:absolute;left:50%;top:67px;width:24px;height:7px;margin-left:-12px;background:var(--mute);transition:background .15s}
.pick[aria-pressed=true] .rest{background:var(--ink)}
.name{display:block;font:700 1.12rem/1.3 var(--serif);color:var(--mute)}
.pick[aria-pressed=true] .name{color:var(--c);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.cnt{display:block;margin-top:2px;font-size:.82rem;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){
  .head{animation:settle .7s cubic-bezier(.2,.8,.3,1) both}
  .pick:nth-child(2) .head{animation-delay:.08s}
  .pick:nth-child(3) .head{animation-delay:.16s}
  .pick:nth-child(4) .head{animation-delay:.24s}
  .pick:nth-child(5) .head{animation-delay:.32s}
  .pick:nth-child(6) .head{animation-delay:.4s}
  .pick:nth-child(7) .head{animation-delay:.48s}
  .pick:nth-child(8) .head{animation-delay:.56s}
}
@keyframes settle{from{transform:translateY(-22px);opacity:0}to{transform:none;opacity:1}}

/* ── 篩選與進度 ── */
.bar{position:sticky;top:0;z-index:5;margin-top:22px;background:var(--paper);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:4px 28px;align-items:center;padding-top:6px;padding-bottom:6px}
.opts{display:flex;gap:2px}
.opt{border:0;background:none;padding:6px 10px;margin-bottom:-1px;cursor:pointer;color:var(--mute);font-size:.92rem;border-bottom:2px solid transparent}
.opt[aria-pressed=true]{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}
.prog{display:flex;align-items:center;gap:12px;margin-left:auto;font-size:.9rem;color:var(--mute)}
#ptext{white-space:nowrap}
.dots{display:flex;flex-wrap:wrap;gap:3px;max-width:230px}
.dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--dc);flex:none}
.dot.on{background:var(--dc)}
@media (max-width:600px){.prog{margin-left:0;width:100%;padding:2px 10px 6px}}
/* 窄螢幕：八顆分兩排，各排自帶五線，不畫小節線 */
@media (max-width:699px){.staff{grid-template-columns:repeat(4,1fr);row-gap:6px}.staff::before,.staff::after{display:none}.name{font-size:1.05rem}}
@media (max-width:699px){.bar{position:static}}

/* ── 節目單：依樂器分組，左側色條就是那支樂器的材質色 ── */
main{padding:8px 0 56px}
.grp{margin-top:44px;padding-left:18px;border-left:4px solid var(--c);--c:var(--ink)}
.grp[data-k=flute]{--c:var(--flute)} .grp[data-k=clarinet]{--c:var(--clarinet)} .grp[data-k=horn]{--c:var(--horn)}
.grp[data-k=violin]{--c:var(--violin)} .grp[data-k=viola]{--c:var(--viola)} .grp[data-k=cello]{--c:var(--cello)} .grp[data-k=sax]{--c:var(--sax)}
h2{margin:0;font:700 clamp(1.7rem,5vw,2.3rem)/1.2 var(--serif);color:var(--c)}
.how{margin:6px 0 0;max-width:36em;color:var(--mute);font-size:.95rem}
.list{list-style:none;margin:14px 0 0;padding:0}
.item{display:grid;grid-template-columns:112px 1fr;gap:6px 16px;padding:18px 0;border-top:1px solid var(--rule)}
.thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:0;border-radius:3px;overflow:hidden;background:var(--paper-2);cursor:pointer;align-self:start}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .2s}
.play{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(18,26,36,.78)}
.play::after{content:"";position:absolute;left:13px;top:10px;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}
.thumb[aria-expanded=true] .play::after{left:11px;top:11px;width:12px;height:12px;border:0;background:#fff}
.item h3{margin:0;font:700 1.12rem/1.5 var(--serif);text-wrap:balance}
.meta{margin:2px 0 0;display:flex;flex-wrap:wrap;gap:0 14px;font-size:.86rem;color:var(--mute)}
.meta span:first-child{color:var(--ink);font-weight:500}
.note{margin:6px 0 0;font-size:.95rem;max-width:34em;text-wrap:pretty}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;margin-top:10px}
.go{font-weight:500;font-size:.92rem;color:var(--c);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.seen{display:flex;gap:7px;align-items:center;font-size:.92rem;cursor:pointer}
.seen input{width:19px;height:19px;margin:0;accent-color:var(--c);cursor:pointer}
.item.done h3,.item.done .note{color:var(--mute)}
.item.done .thumb img{opacity:.5}
.player{grid-column:1/-1;margin-top:10px}
.player[hidden]{display:none}
.player iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000;border-radius:3px}
.empty{padding:60px 0;color:var(--mute)}
@media (min-width:700px){.item{grid-template-columns:208px 1fr}.thumb .play{width:42px;height:42px;margin:-21px 0 0 -21px}.play::after{left:16px;top:12px;border-left-width:13px;border-top-width:9px;border-bottom-width:9px}}

footer{border-top:1px solid var(--rule);padding:22px 0 48px;color:var(--mute);font-size:.84rem}
footer p{margin:0;max-width:44em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1><span class="ph">挑一支樂器，</span><span class="ph">先發出第一個音。</span></h1>
    <p class="lede">管樂四種、弦樂三種，每種都有一批入門教學，每一支都確認過連結還在。選一支跟著練，看完就勾起來。</p>
    <div class="staff" id="staff" role="group" aria-label="選擇樂器"></div>
  </header>
</div>

<div class="bar"><div class="wrap">
  <div class="opts" id="f-lang" role="group" aria-label="語言"></div>
  <div class="opts" id="f-kind" role="group" aria-label="類型"></div>
  <div class="prog"><span id="ptext" aria-live="polite"></span><div class="dots" id="dots" aria-hidden="true"></div></div>
</div></div>

<main class="wrap" id="list"></main>

<footer><div class="wrap"><p>影片版權屬原頻道，本站只整理連結與簡介，播放在 YouTube。學習進度只存在這支手機的瀏覽器，不上傳、不需登入。連結以 YouTube oEmbed 驗證過存在；影片日後被下架的話，請回報原始碼 repo。</p></div></footer>

<script src="data.js"></script>
<script>
const ORDER=["flute","violin","clarinet","sax","viola","cello","horn"];
const INST={all:"全部",flute:"長笛",violin:"小提琴",clarinet:"單簧管",sax:"薩克斯風",viola:"中提琴",cello:"大提琴",horn:"法國號"};
const HOW={
  flute:"氣流吹過吹口邊緣發聲，沒有簧片。先練口型與氣流。",
  clarinet:"單片簧片貼著吹嘴振動發聲。先練簧片的含法與穩定的氣。",
  horn:"嘴唇在吹嘴裡振動發聲，同一指法能吹出好幾個音。先練穩定的長音。",
  violin:"四條弦、用弓拉奏，沒有品格，音準靠耳朵與手指位置。先練持琴、持弓與空弦。",
  viola:"比小提琴大一些、音低五度，譜用中音譜號。先練持琴姿勢與認譜號。",
  cello:"坐著拉，琴立在地上，音域低而溫暖。先練坐姿、持弓與空弦。",
  sax:"單片簧片搭金屬管身，常從中音薩克斯風開始。先練嘴型與吹出穩定的第一個音。"
};
const LANG={all:"全部語言",zh:"中文",en:"英文"};
const KIND={all:"全部類型",video:"單集影片",playlist:"播放清單"};
const LANGN={zh:"中文",en:"英文"};
const COLOR=Object.fromEntries(ORDER.map(k=>[k,`var(--${k})`]));
const F={inst:"all",lang:"all",kind:"all"};
{const h=location.hash.slice(1);if(INST[h])F.inst=h}
const KEY="winds-done-v1";
let done={};try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
const R=window.RESOURCES;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const thumbOf=r=>r.thumb||(r.kind==="video"?`https://i.ytimg.com/vi/${r.id}/mqdefault.jpg`:"");
const embedSrc=r=>r.kind==="playlist"
  ?`https://www.youtube-nocookie.com/embed/videoseries?list=${r.id}`
  :`https://www.youtube-nocookie.com/embed/${r.id}`;
const countOf=k=>k==="all"?R.length:R.filter(r=>r.instrument===k).length;

/* 音符高低＝樂器最低音的高低：長笛最高、法國號最低（y 皆落在線上或間上） */
const NOTE={flute:{y:30,s:"down"},violin:{y:36,s:"down"},clarinet:{y:42,s:"down"},sax:{y:48,s:"down"},viola:{y:54,s:"up"},cello:{y:66,s:"up"},horn:{y:72,s:"up"}};
function drawStaff(){
  document.getElementById("staff").innerHTML=Object.keys(INST).map(k=>{
    const mark=k==="all"?`<span class="rest"></span>`
      :`<span class="head ${NOTE[k].s}" style="top:${NOTE[k].y}px"><i></i></span>`;
    return `<button class="pick" data-k="${k}" aria-pressed="${F.inst===k}"><span class="lines"></span>${mark}<span class="name">${INST[k]}</span><span class="cnt">${countOf(k)} 支教學</span></button>`;
  }).join("");
}
document.getElementById("staff").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  F.inst=b.dataset.k;
  try{history.replaceState(null,"",F.inst==="all"?location.pathname:"#"+F.inst)}catch(e){}
  document.querySelectorAll(".pick").forEach(x=>x.setAttribute("aria-pressed",x.dataset.k===F.inst));
  render();
};
function opts(id,map,key){
  const el=document.getElementById(id);
  el.innerHTML=Object.entries(map).map(([k,v])=>`<button class="opt" data-k="${k}" aria-pressed="${F[key]===k}">${v}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest("button");if(!b)return;F[key]=b.dataset.k;opts(id,map,key);render()};
}
function progress(){
  const pool=R.filter(r=>F.inst==="all"||r.instrument===F.inst);
  const d=pool.filter(r=>done[r.id]).length;
  document.getElementById("ptext").textContent=`${INST[F.inst]}　看過 ${d} / ${pool.length}`;
  document.getElementById("dots").innerHTML=pool.map(r=>`<span class="dot${done[r.id]?" on":""}" style="--dc:${COLOR[r.instrument]}"></span>`).join("");
}
function item(r){
  const th=thumbOf(r);
  return `<li class="item${done[r.id]?" done":""}" data-id="${r.id}">
    <button class="thumb" data-act="prev" aria-expanded="false" aria-label="預覽：${esc(r.title)}">${th?`<img src="${th}" alt="" loading="lazy" referrerpolicy="no-referrer">`:""}<span class="play"></span></button>
    <div>
      <h3>${esc(r.title)}</h3>
      <p class="meta"><span>${esc(r.channel)}</span><span>${LANGN[r.lang]}</span><span>${r.kind==="playlist"?"播放清單":"單集影片"}</span></p>
      <p class="note">${esc(r.note)}</p>
      <div class="acts">
        <a class="go" href="${r.url}" target="_blank" rel="noopener">到 YouTube 看</a>
        <label class="seen"><input type="checkbox" ${done[r.id]?"checked":""}>看過了</label>
      </div>
    </div>
    <div class="player" hidden></div>
  </li>`;
}
function render(){
  progress();
  const groups=ORDER.filter(k=>F.inst==="all"||F.inst===k).map(k=>{
    const rows=R.filter(r=>r.instrument===k&&(F.lang==="all"||r.lang===F.lang)&&(F.kind==="all"||r.kind===F.kind));
    return rows.length?`<section class="grp" data-k="${k}"><h2>${INST[k]}</h2><p class="how">${HOW[k]}</p><ul class="list">${rows.map(item).join("")}</ul></section>`:"";
  }).join("");
  document.getElementById("list").innerHTML=groups||`<p class="empty">這組條件沒有教學，換個篩選看看。</p>`;
}
document.getElementById("list").addEventListener("click",e=>{
  const li=e.target.closest(".item");if(!li)return;
  const r=R.find(x=>x.id===li.dataset.id);
  const thumb=e.target.closest(".thumb");
  if(thumb){
    const slot=li.querySelector(".player");
    const open=thumb.getAttribute("aria-expanded")==="true";
    if(open){slot.innerHTML="";slot.hidden=true}
    else{slot.innerHTML=`<iframe src="${embedSrc(r)}" title="${esc(r.title)}" allow="accelerometer;encrypted-media;picture-in-picture" allowfullscreen loading="lazy"></iframe>`;slot.hidden=false}
    thumb.setAttribute("aria-expanded",String(!open));
  }
  if(e.target.matches('input[type=checkbox]')){
    e.target.checked?done[r.id]=1:delete done[r.id];save();
    li.classList.toggle("done",e.target.checked);
    progress();
  }
});
drawStaff();opts("f-lang",LANG,"lang");opts("f-kind",KIND,"kind");render();
</script>
</body>
</html>
